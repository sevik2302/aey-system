<!DOCTYPE html>
<html>
<head>
  <title>AEY SYSTEM</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<div class="container">
  <div class="small">SYSTEM ACTIVE</div>
  <div class="title">PHASE 0</div>

  <div id="me">fragments: 0</div>
  <div id="world">players: 0</div>
  <div id="ai"></div>

  <div class="btn" id="find">FIND SIGNAL</div>
  <a href="claim.html"><div class="btn">CLAIM</div></a>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================
   1. SAFE INIT (ВАЖНО)
========================= */

let client = null;

try {
  client = supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_KEY
  );
  console.log("Supabase OK");
} catch (e) {
  console.error("Supabase ERROR:", e);
}

/* =========================
   2. PLAYER ID
========================= */

let id = localStorage.getItem("aey_id");
if (!id) {
  id = "u_" + Math.random().toString(36).slice(2, 10);
  localStorage.setItem("aey_id", id);
}

/* =========================
   3. INIT PLAYER
========================= */

async function init() {
  if (!client) return;

  await client.from("players").upsert({
    id,
    fragments: 0,
    phase: 0
  });
}

/* =========================
   4. CORE
========================= */

async function addFragment() {
  const { data } = await client
    .from("players")
    .select("*")
    .eq("id", id)
    .single();

  let f = (data?.fragments || 0) + 1;

  await client
    .from("players")
    .update({ fragments: f })
    .eq("id", id);

  return f;
}

async function getMe() {
  const { data } = await client
    .from("players")
    .select("*")
    .eq("id", id)
    .single();

  return data || { fragments: 0 };
}

async function getWorld() {
  const { data } = await client
    .from("players")
    .select("*");

  return data || [];
}

/* =========================
   5. UI SAFE INIT
========================= */

function render(me, world) {
  document.getElementById("me").innerText =
    "fragments: " + (me?.fragments || 0);

  document.getElementById("world").innerText =
    "players: " + (world?.length || 0);
}

/* =========================
   6. START
========================= */

init();

async function loop() {
  if (!client) return;

  const me = await getMe();
  const world = await getWorld();

  render(me, world);
}

setInterval(loop, 2500);
loop();

/* =========================
   7. BUTTON FIX (ГЛАВНОЕ)
========================= */

document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("find");

  if (!btn) {
    console.error("FIND BUTTON NOT FOUND");
    return;
  }

  btn.onclick = async () => {
    const f = await addFragment();
    const me = await getMe();
    const world = await getWorld();

    render(me, world);

    const msgs = [
      "SYSTEM: anomaly detected",
      "SYSTEM: AEY signal unstable",
      "SYSTEM: pattern locked",
      "SYSTEM: phase shifting"
    ];

    document.getElementById("ai").innerText =
      msgs[Math.floor(Math.random() * msgs.length)];
  };
});

</script>

</body>
</html>
