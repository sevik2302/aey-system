<!DOCTYPE html>
<html>
<head>
  <title>AEY SYSTEM</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="bg"></div>

<div class="container">
  <div class="small">SYSTEM ACTIVE</div>
  <div class="title">PHASE 0</div>

  <div id="me">fragments: 0</div>
  <div id="world">players: 0</div>
  <div id="ai"></div>

  <div class="btn" id="find">FIND SIGNAL</div>
  <a href="claim.html"><div class="btn">CLAIM</div></a>
</div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="game.js"></script>

<script>
let sbReady = false;
let lastState = null;

// =========================
// 1. INIT SAFE
// =========================
(async () => {
  await window.AEY.init();
  sbReady = true;
  await refresh();
})();

// =========================
// 2. UI RENDER FUNCTION
// =========================
function render(me, world) {
  document.getElementById("me").innerText =
    "fragments: " + (me?.fragments ?? 0);

  document.getElementById("world").innerText =
    "players: " + (world?.length ?? 0);
}

// =========================
// 3. LIVE REFRESH LOOP
// =========================
async function refresh() {
  if (!sbReady) return;

  const me = await window.AEY.getMe();
  const world = await window.AEY.getWorld();

  render(me, world);
  lastState = me;
}

// каждые 2 секунды синк
setInterval(refresh, 2000);

// =========================
// 4. CLICK HANDLER (FIXED)
// =========================
document.getElementById("find").onclick = async () => {
  if (!sbReady) return;

  // сразу обновляем в базе
  await window.AEY.addFragment();

  // сразу получаем новое состояние
  const me = await window.AEY.getMe();

  // мгновенно рендерим без refresh страницы
  render(me, await window.AEY.getWorld());

  // AI эффект (без задержек)
  const msgs = [
    "SYSTEM: anomaly detected",
    "SYSTEM: AEY signal unstable",
    "SYSTEM: user pattern matched",
    "SYSTEM: phase pending"
  ];

  document.getElementById("ai").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
};

// =========================
// 5. AI LOOP (визуальный эффект)
// =========================
setInterval(() => {
  const msgs = [
    "SYSTEM: scanning neural pattern",
    "SYSTEM: anomaly stable",
    "SYSTEM: quantum sync active",
    "SYSTEM: AEY node responding"
  ];

  document.getElementById("ai").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
}, 4000);

</script>

</body>
</html>
