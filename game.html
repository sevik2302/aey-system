<!DOCTYPE html>
<html>
<head>
  <title>AEY SYSTEM</title>
  <link rel="stylesheet" href="style.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <div class="small">SYSTEM ACTIVE</div>
  <div class="title">PHASE 0</div>

  <div id="me"></div>
  <div id="world"></div>
  <div id="ai"></div>

  <div class="btn" id="find">FIND SIGNAL</div>

  <a href="claim.html">
    <div class="btn">CLAIM</div>
  </a>
</div>

<!-- CONFIG -->
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="game.js"></script>

<script>
let READY = false;

/* =========================
   SAFE START (NO WHITE SCREEN)
========================= */
async function start() {
  try {
    await window.AEY.boot();

    READY = true;

    window.AEY.enableRealtime(update);

    update();

  } catch (e) {
    console.log("BOOT ERROR:", e);
  }
}

/* =========================
   CLICK
========================= */
document.getElementById("find").onclick = async () => {
  if (!READY) return;

  const f = await window.AEY.addFragment();

  if (f === "cooldown") {
    document.getElementById("ai").innerText =
      "SYSTEM: cooldown active";
    return;
  }

  update();
};

/* =========================
   UI UPDATE
========================= */
async function update() {
  if (!READY) return;

  const me = await window.AEY.getMe();
  const world = await window.AEY.getWorld();

  document.getElementById("me").innerText =
    "fragments: " + (me?.fragments || 0);

  document.getElementById("world").innerText =
    "players: " + world.length;

  const msgs = [
    "SYSTEM: anomaly detected",
    "SYSTEM: AEY signal unstable",
    "SYSTEM: user pattern matched",
    "SYSTEM: phase pending"
  ];

  document.getElementById("ai").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
}

/* =========================
   BOOT GAME
========================= */
start();
</script>

</body>
</html>
