<!DOCTYPE html>
<html>
<head>
  <title>AEY SYSTEM</title>
  <link rel="stylesheet" href="style.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <div class="small">SYSTEM ACTIVE</div>
  <div class="title">PHASE 0</div>

  <div id="me">fragments: 0</div>
  <div id="world">players: 0</div>
  <div id="ai"></div>

  <!-- ✅ ВАЖНО: теперь это button -->
  <button class="btn" id="find">FIND SIGNAL</button>

  <a href="claim.html">
    <div class="btn">CLAIM</div>
  </a>
</div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="game.js"></script>

<script>
/* =========================
   SUPABASE INIT
========================= */

let client = null;

function initSupabase() {
  try {
    client = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_KEY
    );
    console.log("Supabase connected");
  } catch (e) {
    console.error("Supabase init error:", e);
  }
}

/* =========================
   PLAYER ID
========================= */

let id = localStorage.getItem("aey_id");

if (!id) {
  id = "u_" + Math.random().toString(36).slice(2, 10);
  localStorage.setItem("aey_id", id);
}

/* =========================
   INIT PLAYER
========================= */

async function initPlayer() {
  if (!client) return;

  await client.from("players").upsert({
    id,
    fragments: 0,
    phase: 0
  });
}

/* =========================
   GAME LOGIC
========================= */

async function addFragment() {
  const { data } = await client
    .from("players")
    .select("*")
    .eq("id", id)
    .single();

  let f = (data?.fragments || 0) + 1;

  await client
    .from("players")
    .update({ fragments: f })
    .eq("id", id);

  return f;
}

async function getMe() {
  const { data } = await client
    .from("players")
    .select("*")
    .eq("id", id)
    .single();

  return data || { fragments: 0 };
}

async function getWorld() {
  const { data } = await client
    .from("players")
    .select("*");

  return data || [];
}

/* =========================
   RENDER
========================= */

function render(me, world) {
  document.getElementById("me").innerText =
    "fragments: " + (me?.fragments || 0);

  document.getElementById("world").innerText =
    "players: " + (world?.length || 0);
}

/* =========================
   START
========================= */

initSupabase();
initPlayer();

/* =========================
   LIVE LOOP (без лагов)
========================= */

async function loop() {
  if (!client) return;

  const me = await getMe();
  const world = await getWorld();

  render(me, world);
}

setInterval(loop, 2000);
loop();

/* =========================
   BUTTON FIX
========================= */

document.getElementById("find").addEventListener("click", async () => {
  const f = await addFragment();

  const me = await getMe();
  const world = await getWorld();

  render(me, world);

  const msgs = [
    "SYSTEM: anomaly detected",
    "SYSTEM: AEY signal unstable",
    "SYSTEM: pattern sync",
    "SYSTEM: phase unlocked"
  ];

  document.getElementById("ai").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
});

</script>

</body>
</html>
