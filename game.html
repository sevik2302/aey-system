<!DOCTYPE html>
<html>
<head>
  <title>AEY SYSTEM</title>
  <link rel="stylesheet" href="style.css">

  <!-- ✅ CRITICAL FIX: Supabase SDK (ОБЯЗАТЕЛЬНО) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<div class="bg"></div>

<div class="container">
  <div class="small">SYSTEM ACTIVE</div>
  <div class="title">PHASE 0</div>

  <div id="me">fragments: 0</div>
  <div id="world">players: 0</div>
  <div id="ai"></div>

  <div class="btn" id="find">FIND SIGNAL</div>
  <a href="claim.html"><div class="btn">CLAIM</div></a>
</div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="game.js"></script>

<script>
let sb = null;
let id = localStorage.getItem("aey_id");

// =========================
// 1. PLAYER ID
// =========================
if (!id) {
  id = "u_" + Math.random().toString(36).slice(2, 10);
  localStorage.setItem("aey_id", id);
}

// =========================
// 2. INIT SUPABASE (FIXED)
// =========================
function initSupabase() {
  if (!window.SUPABASE_URL || !window.SUPABASE_KEY) {
    console.error("Missing Supabase keys");
    return;
  }

  if (!window.supabase) {
    console.error("Supabase SDK not loaded");
    return;
  }

  sb = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_KEY
  );

  console.log("Supabase ready");
}

// =========================
// 3. INIT PLAYER
// =========================
async function initPlayer() {
  if (!sb) return;

  await sb.from("players").upsert({
    id,
    fragments: 0,
    phase: 0
  });
}

// =========================
// 4. ADD FRAGMENT
// =========================
async function addFragment() {
  if (!sb) return 0;

  let { data } = await sb
    .from("players")
    .select("*")
    .eq("id", id)
    .single();

  let f = (data?.fragments || 0) + 1;

  await sb
    .from("players")
    .update({ fragments: f })
    .eq("id", id);

  return f;
}

// =========================
// 5. GET PLAYER
// =========================
async function getMe() {
  if (!sb) return { fragments: 0 };

  let { data } = await sb
    .from("players")
    .select("*")
    .eq("id", id)
    .single();

  return data || { fragments: 0 };
}

// =========================
// 6. GET WORLD
// =========================
async function getWorld() {
  if (!sb) return [];

  let { data } = await sb
    .from("players")
    .select("*");

  return data || [];
}

// =========================
// 7. INIT SEQUENCE
// =========================
(async () => {
  initSupabase();

  setTimeout(async () => {
    await initPlayer();
    refresh();
  }, 800);
})();

// =========================
// 8. UI UPDATE
// =========================
function render(me, world) {
  document.getElementById("me").innerText =
    "fragments: " + (me?.fragments ?? 0);

  document.getElementById("world").innerText =
    "players: " + (world?.length ?? 0);
}

// =========================
// 9. LIVE REFRESH
// =========================
async function refresh() {
  if (!sb) return;

  const me = await getMe();
  const world = await getWorld();

  render(me, world);
}

// auto refresh loop
setInterval(refresh, 2000);

// =========================
// 10. BUTTON CLICK (FIXED)
// =========================
document.getElementById("find").onclick = async () => {
  if (!sb) return;

  const f = await addFragment();
  const me = await getMe();

  render(me, await getWorld());

  const msgs = [
    "SYSTEM: anomaly detected",
    "SYSTEM: AEY signal unstable",
    "SYSTEM: user pattern matched",
    "SYSTEM: phase pending"
  ];

  document.getElementById("ai").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
};

// =========================
// 11. AI LOOP
// =========================
setInterval(() => {
  const msgs = [
    "SYSTEM: scanning neural pattern",
    "SYSTEM: quantum sync active",
    "SYSTEM: AEY node responding",
    "SYSTEM: anomaly stable"
  ];

  document.getElementById("ai").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
}, 4000);

</script>

</body>
</html>
