<!DOCTYPE html>
<html>
<head>
  <title>AEY SYSTEM</title>
  <link rel="stylesheet" href="style.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 🖤 ДОПОЛНИТЕЛЬНЫЙ ВИЗУАЛ -->
  <style>
    body {
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* фон-слой */
    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111 0%, #000 70%);
      opacity: 0.9;
      z-index: 0;
    }

    /* контейнер поверх */
    .container {
      position: relative;
      z-index: 2;
      animation: appear 0.8s ease both;
    }

    /* плавное появление */
    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    /* текстовые элементы */
    .small {
      opacity: 0.4;
      letter-spacing: 3px;
    }

    .title {
      letter-spacing: 12px;
      text-shadow: 0 0 20px rgba(255,255,255,0.08);
    }

    /* кнопки */
    .btn {
      margin-top: 15px;
      padding: 12px 26px;
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: 0.25s ease;
      user-select: none;
    }

    .btn:hover {
      transform: scale(1.04);
      background: #fff;
      color: #000;
    }

    /* лёгкий “живой” эффект */
    #ai {
      opacity: 0.6;
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    #me, #world {
      opacity: 0.8;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <div class="small">SYSTEM ACTIVE</div>
  <div class="title">PHASE 0</div>

  <div id="me"></div>
  <div id="world"></div>
  <div id="ai"></div>

  <div class="btn" id="find">FIND SIGNAL</div>

  <a href="claim.html">
    <div class="btn">CLAIM</div>
  </a>
</div>

<!-- CONFIG -->
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="game.js"></script>

<script>
let READY = false;

/* =========================
   SAFE START
========================= */
async function start() {
  try {
    await window.AEY.boot();

    READY = true;

    window.AEY.enableRealtime(update);

    update();

  } catch (e) {
    console.log("BOOT ERROR:", e);
  }
}

/* =========================
   CLICK EFFECT (мягкий отклик)
========================= */
document.getElementById("find").onclick = async () => {
  if (!READY) return;

  const btn = document.getElementById("find");

  /* микро-анимация клика */
  btn.style.transform = "scale(0.97)";
  setTimeout(() => {
    btn.style.transform = "scale(1)";
  }, 120);

  const f = await window.AEY.addFragment();

  if (f === "cooldown") {
    document.getElementById("ai").innerText =
      "SYSTEM: cooldown active";
    return;
  }

  update();
};

/* =========================
   UI UPDATE
========================= */
async function update() {
  if (!READY) return;

  const me = await window.AEY.getMe();
  const world = await window.AEY.getWorld();

  document.getElementById("me").innerText =
    "fragments: " + (me?.fragments || 0);

  document.getElementById("world").innerText =
    "players: " + world.length;

  const msgs = [
    "SYSTEM: anomaly detected",
    "SYSTEM: AEY signal unstable",
    "SYSTEM: user pattern matched",
    "SYSTEM: phase pending"
  ];

  document.getElementById("ai").innerText =
    msgs[Math.floor(Math.random() * msgs.length)];
}

/* =========================
   BOOT
========================= */
start();
</script>

</body>
</html>
