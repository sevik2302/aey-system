<!DOCTYPE html>
<html>
<head>
  <title>CLAIM AEY</title>
  <link rel="stylesheet" href="style.css">

  <!-- 🟢 ДОБАВЛЕНО -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <div class="small">CLAIM SYSTEM</div>
  <div class="title">WALLET</div>

  <button class="btn" id="connect">CONNECT PHANTOM</button>
  <div id="info"></div>

  <button class="btn" id="claim">CLAIM TOKENS</button>
</div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="game.js"></script>

<script>
let wallet = null;

/* 🟡 БЕЗ ИЗМЕНЕНИЙ */
document.getElementById("connect").onclick = async () => {
  if (window.solana) {
    const res = await window.solana.connect();
    wallet = res.publicKey.toString();

    document.getElementById("info").innerText =
      "wallet: " + wallet;
  } else {
    alert("Install Phantom Wallet");
  }
};

/* 🟡 БЕЗ ИЗМЕНЕНИЙ */
document.getElementById("claim").onclick = async () => {
  const me = await window.AEY.getMe();
  const f = me?.fragments || 0;

  if (f < window.CONFIG.MIN_CLAIM) {
    alert("not enough fragments");
    return;
  }

  const tokens = f * window.CONFIG.FRAGMENTS_TO_TOKEN;

  alert(
    "CLAIM READY\n\n" +
    "token: " + tokens + "\n" +
    "wallet: " + wallet
  );
};
</script>

</body>
</html>
