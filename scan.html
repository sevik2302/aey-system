<!DOCTYPE html>
<html>
<head>
  <title>SCAN</title>
  <link rel="stylesheet" href="style.css">

  <script type="module">
    import { init } from "./game.js";
    init();
  </script>
</head>
<body>

<div class="bg"></div>

<div class="container">

  <div class="small">SCANNING</div>
  <div class="title" id="p">0%</div>

  <a href="game.html">
    <div class="btn">FORCE ENTRY</div>
  </a>

</div>

<script>
let i=0;
setInterval(()=>{
  if(i<100){
    i++;
    document.getElementById("p").innerText=i+"%";
  }
},20);
</script>

</body>
</html>
